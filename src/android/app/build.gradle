apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Подпись release: keystore.properties и keystore лежат вне git.
// Если файла нет — release подписывается debug-ключом (только для внутренних проверок).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "hackuna.matata"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId = "hackuna.matata"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 2
        versionName = "0.2.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters += ['arm64-v8a'] }
    }
    androidResources {
        // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
        // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        // Модели не сжимаем: их копирует ModelManager потоково, а сжатие только замедляет сборку.
        noCompress += ['onnx', 'gguf', 'litertlm', 'bin', 'tflite', 'task']
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile = rootProject.file(keystoreProps['storeFile'])
                storePassword = keystoreProps['storePassword']
                keyAlias = keystoreProps['keyAlias']
                keyPassword = keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            // FakePipeline (только debug): auto — когда модели не установлены; true — всегда; false — никогда.
            // Пример: ./gradlew installDebug -Psteno.fakePipeline=true
            buildConfigField "String", "FAKE_PIPELINE", "\"${project.findProperty('steno.fakePipeline') ?: 'auto'}\""
            // Заглушка ASR (только debug): настоящие VAD и диаризация, вместо текста — «[речь 3,2 с]».
            // Пример: ./gradlew installDebug -Psteno.fakePipeline=false -Psteno.fakeAsr=true
            buildConfigField "String", "FAKE_ASR", "\"${project.findProperty('steno.fakeAsr') ?: 'false'}\""
        }
        release {
            buildConfigField "String", "FAKE_PIPELINE", "\"false\""
            buildConfigField "String", "FAKE_ASR", "\"false\""
            minifyEnabled = false   // включать только после проверки keep-правил
            if (keystorePropsFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                logger.warn('WARNING: keystore.properties не найден — release подписан debug-ключом')
                signingConfig = signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    packaging {
        jniLibs { useLegacyPackaging = false }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    implementation project(':core:model')
    implementation project(':core:audio')
    implementation project(':core:data')
    implementation project(':ml:runtime')
    implementation project(':ml:sherpa')
    implementation project(':ml:asr')
    implementation project(':ml:diarization')
    implementation project(':ml:llm')
    implementation project(':pipeline')

    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.service
    implementation libs.androidx.documentfile
    implementation libs.kotlinx.coroutines.android
    implementation libs.koin.android

    testImplementation "junit:junit:$junitVersion"
    testImplementation libs.kotlinx.coroutines.test
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'
